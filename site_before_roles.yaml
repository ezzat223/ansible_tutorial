
---

- hosts: all
  become: true
  pre_tasks:
  - name: Update repository index (cache) on Ubuntu and Debian   # Task description
    tags: always    # This task will run whenever the playbook runs (not skippable with tags)
    package:        # Generic package management module
      update_cache: yes   # Updates package cache (like 'apt update')
    changed_when: false   # Forces Ansible to report this task as "ok" instead of "changed". This allows you to have control over what is considered a change, here we're just updating the cache (repository index like apt update) which is always going to result in changes! and it's not going to affect what we're doing! So consider it no change no matter what
    when: ansible_distribution in ["Ubuntu", "Debian"]
  
  - name: Update repository index (cache) on RedHat and CentOS
    tags: always
    package:
      update_cache: yes 
    changed_when: false 
    when: ansible_distribution in ["RedHat", "CentOS"]
  
    # ----------- Make sure public key is added to sudoer user from bootstrap -------------- #
  # so you can connect to that machine using that user as he has the public key
  # Still leave it here although it exists in the boostrap, so you can have Key Management (eg: change the key)
  - name: Add SSH Public Key for simone user in authorized_key file
    tags: always,ssh
    authorized_key:
      user: simone
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPwOZz/n5jW93L8xx9jTAQMtcZgtMOKxjFGVjYW/N8/o Ansible"
      state: present  # Ensures the key is added if it's not already there to avoid duplicates.


