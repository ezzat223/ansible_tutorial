# ---------------- web_servers ---------------- #
- hosts: web_servers
  become: true 
  tasks:
  - name: Install latest apache and PHP on web_servers
    tags: apache,apache2,httpd,php
    package:
      name:
        - "{{ apache_package }}"
        - "{{ php_package }}"
      state: latest

  - name: Copy default HTML file for site
    tags: apache,apache2,httpd
    copy: 
      src: default_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644
  
  # Start apache or httpd ------
  - name: Start httpd on RedHat and CentOS
    service:
      name: httpd
      state: started
      enabled: yes
    when: ansible_distribution in ["RedHat", "CentOS"]

  - name: Start apache2 on Ubuntu and Debian
    service:
      name: apache2
      state: started
      enabled: yes
    when: ansible_distribution in ["Ubuntu", "Debian"]
  

  # change email address for admin and register result (changed, ok, or failed) in a variable called httpd ------
  - name: change email address for admin for RedHat and CentOS   # Task description
    tags: apache,centos,httpd,redhat    # Multiple tags for filtering when running playbook
    lineinfile:                         # Module to modify a specific line in a file
      path: /etc/httpd/conf/httpd.conf  # Apache config file location on RedHat/CentOS
      regex: '^ServerAdmin'             # Regular expression to find line starting with 'ServerAdmin'
      line: ServerAdmin ezzat22hegazy@gmail.com  # The new line to replace the matched line
    when: ansible_distribution in ["RedHat", "CentOS"]  # Only run on RedHat/CentOS systems
    register: httpd    # Store the result of this task in a variable named 'httpd'


  # restart apache or httpd if email changed (httpd variable) ------
  - name: restart httpd     # Task description
    service:             # Module for managing services
      name: httpd        # The service to manage (Apache on RedHat/CentOS)
      state: restarted   # Desired state (restart the service)
    when: httpd.changed  # Only restart if the previous task changed the config file



